services:
  fintech-practice-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      REDIS_URL: redis://fintech-practice-redis:6379
    ports:
      - "127.0.0.1:6500:6500"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - fintech-practice-redis

  fintech-practice-redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
